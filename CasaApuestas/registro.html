    <di>Rellena Este Formulario Para Completar El Registro</di>
    <fieldset>
        <br>
        <label for="nom1">Nombre:</label><input id="nom1" type="text" required><br><br>
        <label for="ape1">Apellidos:</label><input id="ape1" type="text" required><br><br>
        <label for="localidad">Localidad:</label>
        <input type="text" id="ciudad" list="ciudades" placeholder="Escribe tu ciudad" required>
        <datalist id="ciudades">
            <option value="Bilbo">
            <option value="Donosti">
            <option value="Gazteiz">
            <option value="Iruña">
        </datalist>
        <button type="button" onclick="validarCiudad()">Validar</button><br><br>
        <h3 id="error-message" style=" display: none;"></h3>
        <script>
            function validarCiudad() {
                var ciudadIngresada = document.getElementById('ciudad').value;
                var localidadesValidas = ['Bilbo', 'Donosti', 'Gazteiz', 'Iruña'];
                var errorMessage = document.getElementById('error-message');
                var encontrado = false;

                for (var i = 0; i < localidadesValidas.length; i++) {
                    if (localidadesValidas[i].toLowerCase() === ciudadIngresada.toLowerCase()) {
                        encontrado = true;
                        break;
                    }
                }
                if (encontrado) {
                    errorMessage.style.display='none';
                } else {    
                    errorMessage.style.display = 'block';
                    errorMessage.textContent = "La ciudad no esta en la lista";
                }
            }
        </script>
        <label for="gmail">Escribe tu Gmail:</label><input type="email" id="gmail"><br><br>
